name: Signing cert fingerprint

# Read-only diagnostic: prints the SERIAL NUMBER of the distribution cert held
# in this repo's IOS_DIST_P12_BASE64 secret — never the key material. Used to
# map which of the team's two live distribution certs belongs to Grimoire, so a
# sibling app (team JQS67937W6 is shared by six apps) can be repaired without
# revoking the wrong cert. Dispatch-only.

on:
  workflow_dispatch:

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Print certificate serial only
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          printf '%s' "$P12_B64" | tr -d '[:space:]' | base64 --decode > /tmp/d.p12
          openssl pkcs12 -in /tmp/d.p12 -passin "pass:$P12_PW" -clcerts -nokeys -legacy 2>/dev/null \
            | openssl x509 -noout -serial
          rm -f /tmp/d.p12
